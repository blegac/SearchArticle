[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "searcharticle"
version = "1.0.1"
description = "Scientific PDF downloader (DOI, PMID, title, BibTeX) with institutional access support — CustomTkinter graphical interface"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Benjamin Le Gac" },
]
keywords = ["pdf", "scientific-articles", "doi", "pubmed", "crossref", "unpaywall", "institutional-access"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "customtkinter",
    "requests",
]

[project.scripts]
searcharticle = "searcharticle.__main__:main"

[project.urls]
Homepage = "https://github.com/blegac/SearchArticle"

[tool.setuptools.packages.find]
where = ["src"]
